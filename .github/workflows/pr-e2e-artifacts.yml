name: '✓PR E2E Artifacts'

on:
  workflow_dispatch:

concurrency:
  group: pr-e2e-artifacts-${{ github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_INSTALL_REGISTRY: 'https://registry.npmjs.org/'
  # E2E dev mode must never fall back to an unpinned runner-global backend.
  # This is the reviewed AionCore 0.1.55 merge; release artifact pinning remains
  # a separate contract and must wait for an immutable tag and verified bundles.
  AIONCORE_E2E_SOURCE_COMMIT: ef6e1dd199e884fdf2df95d494b2c51b97006656

jobs:
  e2e-artifacts:
    name: E2E Artifacts (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Checkout pinned AionCore source
        uses: actions/checkout@v6
        with:
          repository: khoapnt-vng/aioncore
          ref: ${{ env.AIONCORE_E2E_SOURCE_COMMIT }}
          path: .e2e-aioncore

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.95.0'

      - name: Cache AionCore build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: '.e2e-aioncore -> target'
          shared-key: e2e-aioncore-0.1.55-linux

      - name: Build pinned AionCore backend
        working-directory: .e2e-aioncore
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${AIONCORE_E2E_SOURCE_COMMIT}"
          python3 scripts/migration/generate-lineage.py \
            --migrations crates/aionui-db/migrations \
            --check migration-lineage.json
          cargo build --locked --release -p aionui-app
          test -x target/release/aioncore

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup just
        uses: extractions/setup-just@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run postinstall
        run: npm run postinstall || true

      - name: Install Linux display dependencies (E2E)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgbm-dev xvfb

      - name: Run E2E tests (with screenshots)
        run: xvfb-run --auto-servernum just e2e-test
        env:
          CI: true
          E2E_DEV: '1'
          E2E_SCREENSHOTS: '1'
          # electron.vite.config.ts resolves this at build time. Without it,
          # Studio tests silently redirect to /guid and fail as missing UI.
          AIONUI_ENABLE_CREATIVE_STUDIO: '1'
          AIONUI_BACKEND_BINARY: ${{ github.workspace }}/.e2e-aioncore/target/release/aioncore
          AIONUI_EXTENSIONS_PATH: ${{ github.workspace }}/examples

      - name: Upload E2E report (self-contained with screenshots & traces)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-report-linux-pr
          path: |
            tests/e2e/report/
            tests/e2e/results/
            tests/e2e/screenshots/
          retention-days: 14
          if-no-files-found: ignore
