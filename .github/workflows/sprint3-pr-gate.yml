name: Pull Request CI

on:
  pull_request:
    branches: [sprint3]
  push:
    branches: [sprint3]

concurrency:
  group: pull-request-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_INSTALL_REGISTRY: 'https://registry.npmjs.org/'

jobs:
  quality-and-tests:
    # macOS runner, matching how the suite has always been run and the primary
    # platform the product ships on. The gate briefly ran on ubuntu-latest and
    # found 26 host-dependent failures (BUG-042): updater/tray/menu tests that
    # implicitly assert darwin behaviour. Linux is inherited upstream build
    # capability, NOT a release target (product owner, 2026-08-10), so the
    # gate follows the shipping reality instead of forcing 25 test edits for a
    # host nobody ships on. If a Linux release is ever chartered, BUG-042
    # documents exactly what breaks.
    #
    # macos-15 = the same runner family as build-and-release.yml's arm64 leg.
    # If a required status check is ever configured, it must reference THIS
    # job name.
    name: Quality and tests (macOS)
    runs-on: macos-15
    timeout-minutes: 45
    # BLOCKING as of 2026-08-10. `continue-on-error` was removed after this
    # gate passed a full hosted run (`31405462957`: every step green, zero
    # failing tests) once BUG-042's CI-environment isolation landed.
    #
    # Known intermittent signatures remain blocking until the failed attempt,
    # an unchanged focused diagnostic, and a reviewer disposition are all in
    # the evidence ledger. A later green job never erases an earlier red run.
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.14

      - name: Restore Bun dependency cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.3.14-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-1.3.14-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bunx tsc --noEmit

      - name: Lint
        run: bun run lint

      - name: Check formatting
        run: bunx oxfmt --check

      - name: Validate i18n
        run: |
          bun run i18n:types
          node scripts/check-i18n.js

      - name: Run and ledger the Vitest suite once
        run: >-
          node scripts/release/run-vitest-gate.js
          --register docs/release/sprint3-internal/known-flakes.json
          --ledger "$RUNNER_TEMP/full-suite-ledger.json"
          --log-dir "$RUNNER_TEMP/vitest"
          -- bun run test

      - name: Upload Vitest gate evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: sprint3-vitest-gate-${{ github.sha }}
          path: |
            ${{ runner.temp }}/full-suite-ledger.json
            ${{ runner.temp }}/vitest/*.log
            docs/release/sprint3-internal/known-flakes.json
          if-no-files-found: error
          retention-days: 30
